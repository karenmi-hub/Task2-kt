{% extends "base.html" %}
{% block content %}
<h1>{{ post.title }}</h1>
<p>Автор: {{ post.author.username }} | Дата: {{ post.created_at }}</p>
<p>{{ post.body }}</p>
<a href="/">На главную</a>
{% if is_author %}
    <a href="/posts/{{ post.id }}/edit">Редактировать</a>
    <form method="post" action="/posts/{{ post.id }}/delete" style="display:inline">
        <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
    </form>
{% endif %}
{% endblock %}
